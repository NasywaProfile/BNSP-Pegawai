<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pegawai - Aplikasi Data Pegawai</title>
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="pegawai">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="dashboard.html">
                <i class="bi bi-people-fill text-primary me-1"></i> Data Pegawai
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pegawai.html">Daftar Pegawai</a></li>
                    <li class="nav-item"><a class="nav-link" href="form_pegawai.html">Tambah Pegawai</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small"><i class="bi bi-person-circle me-1"></i><span id="namaUser">-</span></span>
                    <button id="btnLogout" class="btn btn-sm btn-outline-danger">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-3 fade-in">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <h5 class="mb-0">Daftar Pegawai</h5>
            <a href="form_pegawai.html" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i> Tambah Pegawai
            </a>
        </div>

        <div id="alertBox"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-body py-2">
                <div class="input-group input-group-sm" style="max-width: 320px;">
                    <input type="text" id="inputCari" class="form-control" placeholder="Cari NIP, nama, departemen...">
                    <button id="btnCari" class="btn btn-outline-secondary" type="button">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
            <div class="table-responsive table-scroll-list">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>NIP</th>
                            <th>Nama</th>
                            <th>Departemen</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPegawai">
                        <tr><td colspan="5" class="text-center text-muted">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
