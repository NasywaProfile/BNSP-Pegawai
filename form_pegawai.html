<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pegawai - Aplikasi Data Pegawai</title>
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="form">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="dashboard.html">
                <i class="bi bi-people-fill text-primary me-1"></i> Data Pegawai
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="pegawai.html">Daftar Pegawai</a></li>
                    <li class="nav-item"><a class="nav-link active" href="form_pegawai.html">Tambah Pegawai</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small"><i class="bi bi-person-circle me-1"></i><span
                            id="namaUser">-</span></span>
                    <button id="btnLogout" class="btn btn-sm btn-outline-danger">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-3 fade-in page-main" style="max-width: 720px;">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0" id="judulForm">Tambah Pegawai</h5>
            <a href="pegawai.html" class="btn btn-sm btn-outline-secondary">Kembali</a>
        </div>

        <div id="alertBox"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-3">
                <form id="formPegawai" novalidate>
                    <input type="hidden" id="id">

                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="nip" class="form-label mb-1 small">NIP</label>
                            <input type="text" id="nip" class="form-control form-control-sm"
                                placeholder="Contoh: 19900101001">
                        </div>
                        <div class="col-md-6 mb-2">
                            <label for="nama" class="form-label mb-1 small">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-control form-control-sm"
                                placeholder="Nama pegawai">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="email" class="form-label mb-1 small">Email</label>
                            <input type="email" id="email" class="form-control form-control-sm"
                                placeholder="nama@kantor.id">
                        </div>
                        <div class="col-md-6 mb-2">
                            <label for="no_hp" class="form-label mb-1 small">No. HP</label>
                            <input type="text" id="no_hp" class="form-control form-control-sm"
                                placeholder="081234567890">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label for="departemen" class="form-label mb-1 small">Departemen</label>
                            <select id="departemen" class="form-select form-select-sm">
                                <option value="">-- Pilih Departemen --</option>
                                <option value="Teknologi Informasi">Teknologi Informasi</option>
                                <option value="Sumber Daya Manusia">Sumber Daya Manusia</option>
                                <option value="Keuangan">Keuangan</option>
                                <option value="Operasional">Operasional</option>
                                <option value="Pemasaran">Pemasaran</option>
                                <option value="Media Sosial">Media Sosial</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tanggal_masuk" class="form-label mb-1 small">Tanggal Masuk</label>
                            <input type="date" id="tanggal_masuk" class="form-control form-control-sm">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-save me-1"></i> Simpan
                        </button>
                        <a href="pegawai.html" class="btn btn-light btn-sm border">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
